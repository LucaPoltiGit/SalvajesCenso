org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Set to true: with it false, plugins that still apply their own Kotlin
# Gradle Plugin (like file_picker) don't get a compileDebugKotlin task
# registered at all, so their classes (e.g. FilePickerPlugin) never compile
# and the app fails to link with "cannot find symbol".
android.builtInKotlin=true
# Kotlin's incremental compiler uses relative paths between the pub-cache and
# the project to key its caches. When they live on different drives (e.g.
# pub-cache on C:, project on E:), that path computation throws
# IllegalArgumentException and breaks the build. Incremental compilation is
# just a speed optimization, so disabling it avoids the crash.
kotlin.incremental=false
